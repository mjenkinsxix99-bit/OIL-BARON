
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
  :root{--bg:#1a1a2e;--panel:#16213e;--border:#0f3460;--gold:#f5a623;--gold-d:#c17a0e;--green:#4ade80;--red:#f87171;--cream:#fef3c7;--oil:#0d0d0d;--rust:#c2410c}
  body,#game{font-family:'Press Start 2P',monospace;background:var(--bg);color:var(--cream)}
  #game{display:grid;grid-template-columns:190px 1fr 210px;grid-template-rows:48px 1fr 36px;height:640px;border:4px solid var(--gold);box-shadow:0 0 0 2px var(--gold-d),0 0 0 6px #000;overflow:hidden;position:relative}
  #header{grid-column:1/-1;background:var(--oil);border-bottom:4px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;z-index:10}
  #title{font-size:9px;color:var(--gold);letter-spacing:1px}
  #oil-count{font-size:7px;color:var(--cream)}
  #oil-count span{color:var(--gold);font-size:9px}
  #prestige-btn{font-family:'Press Start 2P',monospace;font-size:6px;background:var(--rust);color:var(--cream);border:2px solid var(--red);padding:4px 7px;cursor:pointer;display:none}
  #prestige-btn:hover{background:var(--red)}
  #stats-panel{background:var(--panel);border-right:4px solid var(--border);padding:8px;overflow-y:auto;font-size:6px;display:flex;flex-direction:column;gap:5px;z-index:2}
  .stat-block{border:2px solid var(--border);padding:5px;background:#0a0a1a}
  .stat-label{color:var(--gold);margin-bottom:2px;font-size:5px}
  .stat-val{color:var(--green);font-size:6px}
  #center{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  #world-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
  #rig-wrap{position:relative;cursor:pointer;user-select:none;transition:transform .05s;z-index:5;flex-shrink:0}
  #rig-wrap:active{transform:scale(.96)}
  #ground-strip{width:100%;height:28px;flex-shrink:0;position:relative;z-index:4;background:#5a4020;border-top:4px solid #7a5a28}
  #ground-grass{position:absolute;top:0;left:0;right:0;height:5px;background:#4a7a20}
  .click-pop{position:absolute;font-size:7px;color:var(--gold);font-family:'Press Start 2P',monospace;pointer-events:none;animation:popUp .7s ease forwards;white-space:nowrap;z-index:20}
  @keyframes popUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
  #hud-overlay{position:absolute;bottom:32px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:6;pointer-events:none}
  #pump-label{font-size:5px;color:var(--cream);opacity:.7;letter-spacing:1px}
  #rank-badge{font-size:5px;color:var(--gold);letter-spacing:1px}
  #xp-bar-wrap{width:80%;max-width:180px;border:2px solid var(--border)}
  #xp-bar{height:6px;background:var(--gold);width:0%;transition:width .15s}
  #weather-label{font-size:5px;color:#fff;opacity:.8;background:rgba(0,0,0,.4);padding:2px 6px}
  #ticker{position:absolute;bottom:4px;left:8px;font-size:5px;color:var(--green);opacity:.8;z-index:7}
  #upgrades-panel{background:var(--panel);border-left:4px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;z-index:2}
  #upgrades-title{font-size:6px;color:var(--gold);background:var(--oil);border-bottom:2px solid var(--border);padding:5px 8px;text-align:center}
  .tab-row{display:flex;border-bottom:2px solid var(--border)}
  .tab{flex:1;font-family:'Press Start 2P',monospace;font-size:5px;padding:4px 2px;background:var(--oil);border:none;color:#888;cursor:pointer;border-right:1px solid var(--border)}
  .tab.active{background:var(--panel);color:var(--gold)}
  #tab-content{flex:1;overflow-y:auto;padding:5px;display:flex;flex-direction:column;gap:4px}
  .upgrade-btn{font-family:'Press Start 2P',monospace;font-size:5px;background:#0a0a1a;color:var(--cream);border:2px solid var(--border);padding:5px;cursor:pointer;text-align:left;width:100%;line-height:1.6}
  .upgrade-btn:hover:not(:disabled){border-color:var(--gold);background:#111130}
  .upgrade-btn:disabled{opacity:.35;cursor:not-allowed}
  .upgrade-btn .u-name{color:var(--gold);display:block;margin-bottom:2px}
  .upgrade-btn .u-cost{color:var(--green);display:block}
  .upgrade-btn .u-owned{color:#888;float:right}
  .upgrade-btn .u-desc{color:#aaa;display:block;font-size:4px;margin-top:2px;line-height:1.5}
  #footer{grid-column:1/-1;background:var(--oil);border-top:2px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:5px;color:#666;z-index:10}
  #prestige-stars{font-size:7px;color:var(--gold)}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:var(--oil)}
  ::-webkit-scrollbar-thumb{background:var(--border)}
  #ach-toast{position:absolute;top:0;left:0;right:0;z-index:300;pointer-events:none;display:none}
  #ach-toast-banner{background:#0a0a0a;border-bottom:3px solid var(--gold);padding:10px 20px;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--gold);letter-spacing:1px;position:relative}
  #ach-toast-banner::before{content:'★ ACHIEVEMENT UNLOCKED ★';position:absolute;top:2px;left:0;right:0;font-size:4px;text-align:center;color:var(--gold-d);letter-spacing:3px;opacity:.7}
  #ach-toast-name{margin-top:6px}
  #ach-toast-bonus{font-size:5px;color:var(--green);margin-top:3px}
  #ach-toast-inner{text-align:center}
  #drip-canvas{display:block;width:100%;height:28px}
  .ach-card{background:#0a0a1a;border:2px solid var(--border);padding:5px;font-size:5px;line-height:1.7}
  .ach-card.unlocked{border-color:var(--gold);background:#111100}
  .ach-card .a-icon{font-size:10px;display:block;margin-bottom:3px}
  .ach-card .a-name{color:var(--gold);font-size:5px}
  .ach-card .a-desc{color:#888;font-size:4px}
  .ach-card .a-bonus{color:var(--green);font-size:4px;margin-top:2px}
  .ach-card.locked .a-name{color:#555}
  .ach-card.locked .a-icon{filter:grayscale(1);opacity:.3}
</style>

<h2 style="position:absolute;left:-9999px">Oil Tycoon Clicker</h2>

  </div>

  <div id="footer"><span id="news-ticker">★ TIP: Click the rig to pump oil!</span></div>
</div>

<script>
/* ══════════ WORLD CANVAS ══════════ */
let WC, WX, wW=0, wH=0, groundY=0;
let weather='sunny', weatherTimer=0;
let clouds=[], raindrops=[], tumbleweeds=[], birds=[], lightningBolts=[];
let sunAngle=0, twSpawnTimer=0, birdSpawnTimer=0, cloudSpawnTimer=0, weatherChangeTimer=0;

const SKY={
  sunny: {t1:'#1a6fb5',t2:'#7ecef0'},
  cloudy:{t1:'#556677',t2:'#99aabb'},
  rainy: {t1:'#334455',t2:'#667788'},
  stormy:{t1:'#1a2233',t2:'#334455'},
};
const GROUND_COL={sunny:'#4a7a20',cloudy:'#3a6018',rainy:'#2a5010',stormy:'#1a3808'};
const DIRT_COL={sunny:'#5a4a20',cloudy:'#4a3a18',rainy:'#3a2e10',stormy:'#2a2010'};

function pickWeather(){
  const opts=['sunny','sunny','sunny','cloudy','rainy','stormy'];
  weather=opts[Math.floor(Math.random()*opts.length)];
  const labels={sunny:'☀ SUNNY',cloudy:'☁ CLOUDY',rainy:'🌧 RAIN',stormy:'⚡ STORM'};
  document.getElementById('weather-label').textContent=labels[weather];
  // refresh cloud density
  clouds=clouds.slice(0,2);
  for(let i=clouds.length;i<(weather==='stormy'?8:weather==='rainy'?6:weather==='cloudy'?4:2);i++) addCloud(true);
}

function addCloud(scatter){
  const dark=weather==='rainy'||weather==='stormy';
  clouds.push({
    x: scatter ? Math.random()*wW : wW+80,
    y: 10+Math.random()*(wH*0.28),
    w: 55+Math.random()*75,
    h: 22+Math.random()*18,
    spd: dark ? 1.2+Math.random()*1.4 : 0.25+Math.random()*0.5,
    dark,
    alpha: dark ? 0.85 : 0.7+Math.random()*0.25,
  });
}

function addRaindrops(){
  const n = weather==='stormy'?8:4;
  const sx = weather==='stormy'?0.4:0.15;
  for(let i=0;i<n;i++){
    raindrops.push({
      x:Math.random()*wW, y:-8,
      vx:sx*(3+Math.random()*2), vy:5+Math.random()*5,
      len:5+Math.random()*8, alpha:0.35+Math.random()*0.4
    });
  }
}

function addTumbleweed(){
  const left=Math.random()<0.5;
  const spd=(weather==='stormy'?1.8:0.8)+Math.random()*1.2;
  tumbleweeds.push({
    x: left ? wW+30 : -30,
    y: groundY - 8,
    r: 8+Math.random()*9,
    vx: left ? -spd : spd,
    spin:0, spinSpd:(left?-1:1)*(0.04+Math.random()*0.07),
    bounce:0, bounceSpd:0.1+Math.random()*0.06,
  });
}

function addBird(){
  if(weather==='stormy') return;
  const left=Math.random()<0.5;
  const n=Math.random()<0.35 ? 2+Math.floor(Math.random()*4) : 1;
  for(let i=0;i<n;i++){
    birds.push({
      x:(left?wW+20:-20)+(Math.random()-0.5)*20*i,
      y:16+Math.random()*(wH*0.42),
      vx:(left?-1:1)*(0.7+Math.random()*1.1),
      vy:(Math.random()-0.5)*0.25,
      wp:Math.random()*Math.PI*2,
      ws:0.12+Math.random()*0.1,
      sz:2.5+Math.random()*2.5,
    });
  }
}

function addLightning(){
  if(weather!=='stormy')return;
  lightningBolts.push({x:wW*0.15+Math.random()*wW*0.7, life:12});
}

/* draw helpers */
function drawSky(){
  const p=SKY[weather];
  const g=WX.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,p.t1); g.addColorStop(1,p.t2);
  WX.fillStyle=g; WX.fillRect(0,0,wW,groundY);
}

function drawSun(){
  if(weather==='rainy'||weather==='stormy')return;
  sunAngle+=0.02;
  const a=weather==='cloudy'?0.18:0.95;
  const sx=wW-40, sy=28, sr=13;
  WX.save(); WX.globalAlpha=a;
  for(let i=0;i<12;i++){
    const ang=i*(Math.PI/6)+sunAngle*0.3;
    const rlen=8+Math.sin(sunAngle+i)*3;
    WX.strokeStyle='#ffd700'; WX.lineWidth=1.5; WX.lineCap='round';
    WX.beginPath();
    WX.moveTo(sx+Math.cos(ang)*(sr+3),sy+Math.sin(ang)*(sr+3));
    WX.lineTo(sx+Math.cos(ang)*(sr+3+rlen),sy+Math.sin(ang)*(sr+3+rlen));
    WX.stroke();
  }
  WX.fillStyle='#ffe033'; WX.beginPath(); WX.arc(sx,sy,sr,0,Math.PI*2); WX.fill();
  WX.fillStyle='#ffcc00'; WX.beginPath(); WX.arc(sx-2,sy-2,sr-4,0,Math.PI*2); WX.fill();
  WX.restore();
}

function drawCloud(c){
  WX.save(); WX.globalAlpha=c.alpha;
  const fill=c.dark?'#556677':'#eef6ff';
  const fill2=c.dark?'#445566':'#d8eeff';
  WX.fillStyle=fill2;
  WX.beginPath(); WX.ellipse(c.x,c.y+c.h*.55,c.w*.46,c.h*.42,0,0,Math.PI*2); WX.fill();
  WX.fillStyle=fill;
  WX.beginPath(); WX.ellipse(c.x,c.y+c.h*.28,c.w*.36,c.h*.52,0,0,Math.PI*2); WX.fill();
  WX.beginPath(); WX.ellipse(c.x-c.w*.2,c.y+c.h*.42,c.w*.26,c.h*.36,0,0,Math.PI*2); WX.fill();
  WX.beginPath(); WX.ellipse(c.x+c.w*.22,c.y+c.h*.4,c.w*.24,c.h*.34,0,0,Math.PI*2); WX.fill();
  WX.restore();
}

function drawRaindrop(d){
  WX.save(); WX.globalAlpha=d.alpha;
  WX.strokeStyle=weather==='stormy'?'#99ccff':'#88bbdd';
  WX.lineWidth=1; WX.lineCap='round';
  WX.beginPath();
  WX.moveTo(d.x,d.y);
  WX.lineTo(d.x-d.vx*(d.len/d.vy),d.y-d.len);
  WX.stroke();
  WX.restore();
}

function drawLightningBolt(lb){
  WX.save(); WX.globalAlpha=lb.life/12;
  WX.strokeStyle='#ccddff'; WX.lineWidth=1.5; WX.lineCap='round';
  let lx=lb.x, ly=6;
  WX.beginPath(); WX.moveTo(lx,ly);
  for(let i=0;i<7;i++){lx+=(Math.random()-.5)*18; ly+=Math.random()*22; WX.lineTo(lx,ly);}
  WX.stroke();
  WX.globalAlpha=(lb.life/12)*0.15;
  WX.fillStyle='#ffffff'; WX.fillRect(0,0,wW,groundY);
  WX.restore();
}

function drawTumbleweed(tw){
  WX.save();
  WX.translate(tw.x, tw.y - tw.r - Math.abs(Math.sin(tw.bounce))*5);
  WX.rotate(tw.spin);
  WX.globalAlpha=0.85;
  const r=tw.r;
  WX.strokeStyle='#9B6914'; WX.lineWidth=1.5;
  WX.beginPath(); WX.arc(0,0,r,0,Math.PI*2); WX.stroke();
  WX.lineWidth=1; WX.strokeStyle='#7a5010';
  for(let i=0;i<6;i++){
    const a=i*(Math.PI/6);
    WX.beginPath(); WX.moveTo(Math.cos(a)*r,Math.sin(a)*r); WX.lineTo(Math.cos(a+Math.PI)*r,Math.sin(a+Math.PI)*r); WX.stroke();
  }
  WX.strokeStyle='#b07820';
  for(let i=0;i<4;i++){
    const a=i*(Math.PI/4);
    WX.beginPath(); WX.arc(Math.cos(a)*r*.35,Math.sin(a)*r*.35,r*.48,a,a+Math.PI); WX.stroke();
  }
  WX.restore();
}

function drawBird(b){
  WX.save(); WX.globalAlpha=0.8;
  const wf=Math.sin(b.wp)*b.sz*1.3;
  WX.strokeStyle='#111'; WX.lineWidth=1.4; WX.lineCap='round';
  WX.beginPath(); WX.moveTo(b.x,b.y); WX.quadraticCurveTo(b.x-b.sz*1.1,b.y-wf,b.x-b.sz*2.2,b.y-wf*.4); WX.stroke();
  WX.beginPath(); WX.moveTo(b.x,b.y); WX.quadraticCurveTo(b.x+b.sz*1.1,b.y-wf,b.x+b.sz*2.2,b.y-wf*.4); WX.stroke();
  WX.restore();
}

function drawGround(){
  WX.fillStyle=DIRT_COL[weather]; WX.fillRect(0,groundY,wW,wH-groundY);
  WX.fillStyle=GROUND_COL[weather]; WX.fillRect(0,groundY,wW,5);
  if(weather!=='stormy'){
    WX.fillStyle='#5a8a28';
    for(let i=2;i<wW-4;i+=12){
      const h2=2+Math.abs(Math.sin(i*.5))*3;
      WX.fillRect(i,groundY-h2,2,h2+1);
      WX.fillRect(i+5,groundY-2,1,3);
    }
  }
}

/* rain overlay */
function drawRainOverlay(){
  if(weather!=='rainy'&&weather!=='stormy')return;
  const alpha=weather==='stormy'?0.12:0.07;
  WX.fillStyle=`rgba(100,160,220,${alpha})`;
  WX.fillRect(0,0,wW,groundY);
}

let lightTimer=0, lastWeatherChange=0, frameN=0;

function worldFrame(){
  if(!WX||wW===0){requestAnimationFrame(worldFrame);return;}
  frameN++;
  WX.clearRect(0,0,wW,wH);

  drawSky();
  drawSun();

  /* clouds */
  cloudSpawnTimer++;
  const maxClouds=weather==='stormy'?9:weather==='rainy'?7:weather==='cloudy'?5:3;
  if(cloudSpawnTimer>80&&clouds.length<maxClouds){cloudSpawnTimer=0;addCloud(false);}
  for(let i=clouds.length-1;i>=0;i--){clouds[i].x-=clouds[i].spd;if(clouds[i].x<-140)clouds.splice(i,1);}
  clouds.forEach(drawCloud);

  /* rain */
  if(weather==='rainy'||weather==='stormy'){
    if(frameN%2===0) addRaindrops();
    for(let i=raindrops.length-1;i>=0;i--){raindrops[i].x+=raindrops[i].vx;raindrops[i].y+=raindrops[i].vy;if(raindrops[i].y>groundY)raindrops.splice(i,1);}
    raindrops.forEach(drawRaindrop);
    drawRainOverlay();
  } else {raindrops=[];}

  /* lightning */
  if(weather==='stormy'){
    lightTimer++;
    if(lightTimer>100+Math.random()*180){lightTimer=0;addLightning();}
  }
  for(let i=lightningBolts.length-1;i>=0;i--){lightningBolts[i].life--;if(lightningBolts[i].life<=0)lightningBolts.splice(i,1);}
  lightningBolts.forEach(drawLightningBolt);

  /* birds */
  if(weather!=='stormy'){
    birdSpawnTimer++;
    if(birdSpawnTimer>180+Math.random()*160){birdSpawnTimer=0;addBird();}
  }
  for(let i=birds.length-1;i>=0;i--){
    const b=birds[i];
    b.x+=b.vx; b.y+=b.vy; b.wp+=b.ws;
    b.y=Math.max(12,Math.min(wH*0.5,b.y));
    if(b.x<-60||b.x>wW+60)birds.splice(i,1);
  }
  birds.forEach(drawBird);

  /* tumbleweeds */
  twSpawnTimer++;
  if(twSpawnTimer>220+Math.random()*150&&tumbleweeds.length<3){twSpawnTimer=0;addTumbleweed();}
  for(let i=tumbleweeds.length-1;i>=0;i--){
    const tw=tumbleweeds[i];
    const spd=weather==='stormy'?2:1;
    tw.x+=tw.vx*spd; tw.spin+=tw.spinSpd*(weather==='stormy'?2.2:1); tw.bounce+=tw.bounceSpd;
    if(tw.x<-60||tw.x>wW+60)tumbleweeds.splice(i,1);
  }
  tumbleweeds.forEach(drawTumbleweed);

  drawGround();

  /* weather change ~every 40s */
  weatherChangeTimer++;
  if(weatherChangeTimer>800){weatherChangeTimer=0;pickWeather();}

  requestAnimationFrame(worldFrame);
}

function initWorld(){
  WC=document.getElementById('world-canvas');
  const center=document.getElementById('center');
  const rect=center.getBoundingClientRect();
  wW=rect.width||320;
  wH=rect.height||490;
  WC.width=wW; WC.height=wH;
  WX=WC.getContext('2d');
  groundY=wH-28;
  pickWeather();
  for(let i=0;i<4;i++) addCloud(true);
  addBird();
  addBird();
  addTumbleweed();
  worldFrame();
}

/* ══════════ RIG SVG BUILDERS ══════════ */
function rigRoughneck(){return`

function updateRig(totalOil){

function fmt(n){if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toString()}
function getRawBPS(){return BUILDINGS.reduce((s,b)=>s+b.bps*b.count,0)}
function getTotalMultiplier(){return G.prestigeMultiplier*G.achMultiplier}
function getBPS(){return getRawBPS()*getTotalMultiplier()}
function getBuildingCost(b){return Math.floor(b.base*Math.pow(1.15,b.count))}

let drips=[],dripCanvas,dripCtx,dripRAF=null,toastOpacity=0,toastState='hidden',toastTimer=null;
function initDripCanvas(){dripCanvas=document.getElementById('drip-canvas');dripCtx=dripCanvas.getContext('2d')}
function spawnDrips(w){drips=[];const n=18+Math.floor(Math.random()*10);for(let i=0;i<n;i++)drips.push({x:4+Math.random()*(w-8),y:0,vy:0.4+Math.random()*1.2,len:6+Math.random()*18,width:2+Math.random()*4,alpha:0.7+Math.random()*0.3,blob:3+Math.random()*5,delay:Math.random()*40,done:false})}
function drawDrips(ga){if(!dripCtx)return;const w=dripCanvas.width,h=dripCanvas.height;dripCtx.clearRect(0,0,w,h);drips.forEach(d=>{if(d.delay>0){d.delay--;return}if(d.done)return;d.y+=d.vy;d.vy*=1.03;if(d.y>h+d.blob){d.done=true;return}dripCtx.save();dripCtx.globalAlpha=d.alpha*ga;dripCtx.fillStyle='#0a0a0a';dripCtx.strokeStyle='#1a1a0a';dripCtx.lineWidth=d.width;dripCtx.lineCap='round';dripCtx.beginPath();dripCtx.moveTo(d.x,0);dripCtx.lineTo(d.x,d.y);dripCtx.stroke();dripCtx.beginPath();dripCtx.arc(d.x,d.y,d.blob,0,Math.PI*2);dripCtx.fill();dripCtx.restore()})}
function animateToast(){const banner=document.getElementById('ach-toast-banner');if(toastState==='in'){toastOpacity=Math.min(1,toastOpacity+0.07);banner.style.opacity=toastOpacity;drawDrips(toastOpacity)}else if(toastState==='hold'){drawDrips(1)}else if(toastState==='out'){toastOpacity=Math.max(0,toastOpacity-0.04);banner.style.opacity=toastOpacity;drawDrips(toastOpacity);if(toastOpacity<=0){toastState='hidden';document.getElementById('ach-toast').style.display='none';cancelAnimationFrame(dripRAF);dripRAF=null;return}}dripRAF=requestAnimationFrame(animateToast)}
function showAchievementToast(a){if(!dripCanvas)initDripCanvas();const toast=document.getElementById('ach-toast');const w=document.getElementById('game').offsetWidth||680;dripCanvas.width=w;dripCanvas.height=28;document.getElementById('ach-toast-name').textContent='★ '+a.name+' ★';document.getElementById('ach-toast-bonus').textContent=a.bonus+' UNLOCKED!';document.getElementById('ach-toast-banner').style.opacity=0;toast.style.display='block';toastOpacity=0;toastState='in';spawnDrips(w);if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastState='out'},3200);if(dripRAF)cancelAnimationFrame(dripRAF);dripRAF=requestAnimationFrame(animateToast)}
function checkAchievements(){let changed=false;ACHIEVEMENTS.forEach(a=>{if(!a.unlocked&&a.check()){a.unlocked=true;changed=true;showAchievementToast(a)}});if(changed){G.achMultiplier=Math.pow(1.01,ACHIEVEMENTS.filter(a=>a.unlocked).length);if(G.currentTab==='achievements')renderTab()}}
function clickRig(e){const earned=G.perClick*getTotalMultiplier();G.oil+=earned;G.totalOil+=earned;G.clickCount++;const pop=document.createElement('div');pop.className='click-pop';pop.textContent='+'+fmt(earned)+' bbl';const cx=document.getElementById('center').getBoundingClientRect();pop.style.left=(e.clientX-cx.left-30)+'px';pop.style.top=(e.clientY-cx.top-20)+'px';document.getElementById('center').appendChild(pop);setTimeout(()=>pop.remove(),700);updateRig(G.totalOil);checkAchievements();updateXP();renderAll()}
function updateXP(){const levels=[0,50,200,500,1000,5000,20000,100000];let lvl=0;for(let i=0;i<levels.length;i++)if(G.totalOil>=levels[i])lvl=i;const next=levels[lvl+1]||levels[lvl]*10,prev=levels[lvl];document.getElementById('xp-bar').style.width=Math.min(100,((G.totalOil-prev)/(next-prev))*100)+'%'}
function switchTab(tab){G.currentTab=tab;document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',['buildings','upgrades','achievements'][i]===tab)});renderTab()}
function renderTab(){
  const c=document.getElementById('tab-content');c.innerHTML='';
  if(G.currentTab==='buildings'){BUILDINGS.forEach(b=>{const cost=getBuildingCost(b);const btn=document.createElement('button');btn.className='upgrade-btn';btn.disabled=G.oil<cost;btn.innerHTML=`<span class="u-name">${b.name}<span class="u-owned">[${b.count}]</span></span><span class="u-cost">🛢${fmt(cost)}</span><span class="u-desc">${b.desc} +${b.bps.toFixed(1)}/s</span>`;btn.onclick=()=>buyBuilding(b);c.appendChild(btn)});}
  else if(G.currentTab==='upgrades'){let any=false;UPGRADES.forEach(u=>{if(u.bought)return;any=true;const btn=document.createElement('button');btn.className='upgrade-btn';btn.disabled=G.oil<u.cost;btn.innerHTML=`<span class="u-name">${u.name}</span><span class="u-cost">🛢${fmt(u.cost)}</span><span class="u-desc">${u.desc}</span>`;btn.onclick=()=>buyUpgrade(u);c.appendChild(btn)});if(!any)c.innerHTML='<div style="font-size:5px;color:#888;padding:10px;text-align:center">ALL UPGRADES<br>PURCHASED!</div>';}
  else{const unlocked=ACHIEVEMENTS.filter(a=>a.unlocked).length;const summary=document.createElement('div');summary.style.cssText='font-size:5px;color:var(--gold);padding:4px;text-align:center;border-bottom:1px solid #333;margin-bottom:4px';summary.textContent=unlocked+'/'+ACHIEVEMENTS.length+' | BONUS: x'+G.achMultiplier.toFixed(2);c.appendChild(summary);ACHIEVEMENTS.forEach(a=>{const card=document.createElement('div');card.className='ach-card '+(a.unlocked?'unlocked':'locked');card.innerHTML=`<span class="a-icon">${a.icon}</span><span class="a-name">${a.name}</span><br><span class="a-desc">${a.desc}</span><br><span class="a-bonus">${a.bonus}</span>`;c.appendChild(card)});}
}
function buyBuilding(b){const cost=getBuildingCost(b);if(G.oil<cost)return;G.oil-=cost;b.count++;checkAchievements();renderAll()}
function buyUpgrade(u){if(G.oil<u.cost||u.bought)return;G.oil-=u.cost;u.bought=true;u.effect();checkAchievements();renderAll()}
function prestige(){if(G.totalOil<1000000)return;G.prestigeCount++;G.prestigeMultiplier=1+G.prestigeCount*0.5;G.oil=0;G.totalOil=0;G.perClick=1;G.clickCount=0;BUILDINGS.forEach(b=>{b.count=0});UPGRADES.forEach(u=>{u.bought=false});checkAchievements();renderAll();document.getElementById('prestige-stars').textContent='★'.repeat(G.prestigeCount)}
function renderAll(){document.getElementById('barrel-display').textContent=fmt(G.oil);document.getElementById('bps-display').textContent=fmt(getBPS());document.getElementById('total-display').textContent=fmt(G.totalOil);document.getElementById('cpc-display').textContent=fmt(G.perClick*getTotalMultiplier());document.getElementById('bps2-display').textContent=fmt(getBPS());document.getElementById('prestige-display').textContent=G.prestigeCount;document.getElementById('ach-bonus-display').textContent='x'+G.achMultiplier.toFixed(2);document.getElementById('multi-display').textContent='x'+getTotalMultiplier().toFixed(2);document.getElementById('click-count').textContent=fmt(G.clickCount);document.getElementById('prestige-btn').style.display=G.totalOil>=1000000?'block':'none';updateRig(G.totalOil);renderTab();updateXP()}
let lastTick=Date.now();
function gameTick(){const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;const earned=getBPS()*dt;G.oil+=earned;G.totalOil+=earned;G.frameCount++;if(G.frameCount%30===0)checkAchievements();if(G.frameCount%60===0)renderAll();if(G.frameCount%300===0)document.getElementById('news-ticker').textContent='► '+NEWS[Math.floor(Math.random()*NEWS.length)];setTimeout(gameTick,50)}

/* ── BOOT: use setTimeout to guarantee DOM has laid out ── */
setTimeout(()=>{
  initWorld();
